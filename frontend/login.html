<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Login — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark">
  <main class="container py-5" style="max-width: 480px;">
    <div class="text-center mb-4">
      
        <img src="img/tattu.png" alt="Logo" width="110">
        <h2 class="text-warning fw-bold">Tattu<span class="text-white">Studio</span></h2>

    </div>

    <h1 class="mb-4 fw-bold text-white text-center">ENTRAR</h1>
    <form id="form-login">
      <div class="mb-3">
        <input type="email" id="email" class="form-control" placeholder="E-mail" required>
      </div>
      <div class="mb-3">
        <input type="password" id="senha" class="form-control" placeholder="Senha" required>
      </div>
      <button type="submit" class="btn btn-tattu w-100">Entrar</button>
    </form>
  </main>
  <script src="js/login.js"></script>
</body>

</html>
