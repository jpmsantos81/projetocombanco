<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Tatuadores — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4 p-1">
  <div class="container-fluid px-4">
    <a href="dashboard.html" class="text-decoration-none">
      <div class="d-flex align-items-center gap-2">
        <img src="img/tattu.png" alt="Logo" width="70">
        <span class="navbar-brand mb-0 text-warning fw-bold">Tattu<span class="text-white">Studio</span></span>
      </div>
    </a>
    <div class="d-flex align-items-center gap-3">
      <a href="clientes.html" class="text-light text-decoration-none">Clientes</a>
      <a href="tatuadores.html" class="text-light text-decoration-none">Tatuadores</a>
      <a href="agendamentos.html" class="text-light text-decoration-none">Agendamentos</a>
      <a href="senioridade.html" class="text-light text-decoration-none">Senioridade</a>
      <a href="estilos.html" class="text-light text-decoration-none">Estilos</a>
      <button onclick="sair()" class="btn btn-sm btn-sair">Sair</button>
    </div>
  </div>
</nav>

<main class="container py-4">
  <h1 class="mb-4 fw-bold">TATUADORES</h1>

  <form id="form-tatuador" class="row g-2 mt-2 mb-4">
    <div class="col-md-3">
      <input type="text" id="nometatuador" class="form-control" placeholder="Nome" required>
    </div>
    <div class="col-md-2">
      <input type="text" id="cpf" class="form-control" placeholder="CPF (só números)" required>
    </div>
    <div class="col-md-3">
      <input type="email" id="email" class="form-control" placeholder="E-mail">
    </div>
    <div class="col-md-2">
      <input type="text" id="telefone" class="form-control" placeholder="Telefone">
    </div>
    <div class="col-md-2">
      <select id="idsenioridade" class="form-select" required>
        <option value="">Senioridade...</option>
      </select>
    </div>
    <div class="col-md-12">
      <label class="form-label">Estilos que domina</label>
      <div id="lista-estilos" class="d-flex flex-wrap gap-3">
      </div>
    </div>
    <div class="col-md-2">
      <button id="btn-submit-tatuador" type="submit" class="btn btn-tattu w-100">Cadastrar</button>
    </div>
  </form>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Senioridade</th>
        <th>Estilos</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
      <!-- os tatuadores vão aparecer aqui -->
    </tbody>
  </table>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/tatuadores.js"></script>

</body>
</html>
