<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191d">
  <title>Painel — Tinta Viva</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: #f5f1e9;
      color: #17191d;
      font-family: "Segoe UI", sans-serif;
    }

    .navbar {
      background: #17191d;
    }

    .brand-mark {
      color: #d9a45b;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .dashboard-card {
      display: flex;
      min-height: 160px;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
      border: 1px solid rgba(23, 25, 29, .12);
      border-radius: 14px;
      background: #fff;
      color: #17191d;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .dashboard-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(23, 25, 29, .12);
      color: #17191d;
    }

    .dashboard-card span {
      color: #77736c;
      font-size: .9rem;
    }

    .dashboard-card strong {
      font-size: 1.35rem;
    }

    .eyebrow {
      color: #a56b25;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark mb-5">
    <div class="container py-2">
      <a class="navbar-brand brand-mark" href="dashboard.html">TINTA VIVA</a>
      <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </nav>

  <main class="container pb-5">
    <p class="eyebrow mb-2">Área de gestão</p>
    <h1 class="display-5 fw-bold mb-2">Painel do estúdio</h1>
    <p class="text-secondary mb-4">Escolha uma área para acompanhar e organizar o estúdio.</p>

    <div class="row g-3">
      <div class="col-md-6 col-lg-4">
        <a href="clientes.html" class="dashboard-card"><span>Relacionamento</span><strong>Clientes</strong></a>
      </div>
      <div class="col-md-6 col-lg-4">
        <a href="tatuadores.html" class="dashboard-card"><span>Equipe artística</span><strong>Tatuadores</strong></a>
      </div>
      <div class="col-md-6 col-lg-4">
        <a href="agendamentos.html" class="dashboard-card"><span>Agenda e sessões</span><strong>Agendamentos</strong></a>
      </div>
      <div class="col-md-6 col-lg-4">
        <a href="senioridade.html" class="dashboard-card"><span>Equipe artística</span><strong>Senioridade</strong></a>
      </div>
      <div class="col-md-6 col-lg-4">
        <a href="estilos.html" class="dashboard-card"><span>Catálogo do estúdio</span><strong>Estilos</strong></a>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    protegerPagina()
  </script>
</body>
</html>
