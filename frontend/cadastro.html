<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Cadastro — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark">
  <main class="container py-5" style="max-width: 480px;">
    <div class="text-center mb-4">
      <a href="dashboard.html" class="text-decoration-none">
        <img src="img/tattu.png" alt="Logo" width="110">
        <h2 class="text-warning fw-bold">Tattu<span class="text-white">Studio</span></h2>
      </a>
    </div>

    <h1 class="mb-4 fw-bold text-center text-white">CRIAR CONTA</h1>
    <form id="form-cadastro">
      <div class="mb-3">
        <input type="text" id="nome" class="form-control" placeholder="Nome" required>
      </div>
      <div class="mb-3">
        <input type="email" id="email" class="form-control" placeholder="E-mail" required>
      </div>
      <div class="mb-3">
        <input type="password" id="senha" class="form-control" placeholder="Senha" required>
      </div>
      <button type="submit" class="btn btn-tattu w-100">Cadastrar</button>
    </form>

  </main>
  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>
</body>

</html>
