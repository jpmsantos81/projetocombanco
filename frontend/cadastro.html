<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191d">
  <title>Cadastro — Tinta Viva</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 10% 15%, rgba(217, 164, 91, .15), transparent 30%),
        #17191d;
      color: #f5f1e9;
      font-family: "Segoe UI", sans-serif;
    }

    .brand-mark {
      color: #d9a45b;
      font-weight: 800;
      letter-spacing: .12em;
      text-decoration: none;
    }

    .signup-card {
      width: min(100%, 480px);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid rgba(245, 241, 233, .12);
      border-radius: 16px;
      background: rgba(32, 33, 38, .92);
      box-shadow: 0 25px 80px rgba(0, 0, 0, .28);
    }

    .form-control {
      min-height: 48px;
      border-color: #45464b;
      background: #17191d;
      color: #f5f1e9;
    }

    .form-control:focus {
      border-color: #d9a45b;
      background: #17191d;
      color: #f5f1e9;
      box-shadow: 0 0 0 .2rem rgba(217, 164, 91, .18);
    }

    .form-control::placeholder {
      color: #aaa69d;
    }

    .btn-accent {
      min-height: 48px;
      border-color: #d9a45b;
      background: #d9a45b;
      color: #17191d;
      font-weight: 700;
    }

    .btn-accent:hover {
      border-color: #e7b875;
      background: #e7b875;
      color: #17191d;
    }

    .muted-copy {
      color: #aaa69d;
    }

    .text-link {
      color: #e7b875;
    }
  </style>
</head>
<body>
  <header class="container py-4">
    <a class="brand-mark" href="index.html">TINTA VIVA</a>
  </header>

  <main class="container d-flex justify-content-center align-items-center py-4">
    <section class="signup-card">
      <p class="text-uppercase small fw-bold mb-2" style="color: #d9a45b; letter-spacing: .16em;">Acesso da equipe</p>
      <h1 class="h2 fw-bold mb-2">Criar conta</h1>
      <p class="muted-copy mb-4">Preencha seus dados para cadastrar um acesso ao sistema do estúdio.</p>

      <div id="mensagem-cadastro" class="alert d-none" role="status" aria-live="polite"></div>

      <form id="form-cadastro">
        <div class="mb-3">
          <label for="nome" class="form-label">Nome</label>
          <input type="text" id="nome" class="form-control" placeholder="Seu nome" maxlength="100" autocomplete="name" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" class="form-control" placeholder="voce@exemplo.com" maxlength="150" autocomplete="email" required>
        </div>
        <div class="mb-4">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" id="senha" class="form-control" placeholder="Escolha uma senha" autocomplete="new-password" required>
          <div class="form-text muted-copy">Por segurança, a senha será armazenada como hash.</div>
        </div>
        <button id="botao-cadastro" type="submit" class="btn btn-accent w-100">Cadastrar</button>
      </form>

      <p class="mt-4 mb-0 text-center muted-copy">
        Já tem acesso? <a href="login.html" class="text-link">Entrar</a>
      </p>
      <p class="mt-3 mb-0 text-center"><a href="index.html" class="text-link">Voltar ao início</a></p>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
